<div 
  role="dialog" 
  aria-modal="true" 
  aria-labelledby="alert-dialog-title"
  class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 transition-opacity duration-300 ease-in-out"
>
  <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl w-full max-w-md animate-modal-in">
    <h2 id="alert-dialog-title" class="sr-only">Onay Gerekli</h2>
    <p class="text-lg dark:text-white" aria-describedby="alert-dialog-title">{{ message }}</p>
    
    <div class="mt-6 flex justify-end gap-4">
      <button 
        (click)="onCancel.emit()"
        class="btn-ghost"
      >
        İptal
      </button>
      <button 
        (click)="onConfirm.emit()"
        class="btn-danger"
      >
        Sil
      </button>
    </div>
  </div>
</div>

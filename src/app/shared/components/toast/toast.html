<div class="fixed top-5 right-5 z-50 flex flex-col gap-3">
  <div 
    *ngFor="let toast of toasts"
    role="status"
    aria-live="polite"
    class="p-4 rounded-md shadow-lg text-white max-w-sm flex items-start justify-between gap-3 animate-toast-in"
    [ngClass]="{
      'bg-green-600': toast.type === 'success',
      'bg-red-600': toast.type === 'error'
    }"
  >
    <p class="flex-1">{{ toast.message }}</p>
    <button 
      (click)="removeToast(toast)"
      class="text-white hover:bg-white/20 rounded p-1 font-bold text-xl leading-none transition-all duration-200"
      title="Kapat"
    >
      ✕
    </button>
  </div>
</div>
